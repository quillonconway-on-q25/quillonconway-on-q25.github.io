<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
let currentUid = null;

async function loadMessages() {
  const { data } = await supabase.from('messages').select('*').eq('client_id', currentUid).order('created_at');
  const thread = document.getElementById('messageThread');
  if (!data?.length) {
    thread.innerHTML = `<div class="empty-state" style="padding:32px;"><div class="empty-state-icon">💬</div><h3>No messages yet</h3><p>Send a message to the ON-Q25 team below.</p></div>`;
    return;
  }
  thread.innerHTML = data.map(m => `
    <div class="message-bubble ${m.is_from_admin ? 'from-admin' : 'from-client'}">
      <div class="bubble-content">${escHtml(m.content)}</div>
      <div class="bubble-meta">${m.is_from_admin ? 'ON-Q25' : 'You'} · ${formatDate(m.created_at)} ${formatTime(m.created_at)}</div>
    </div>`).join('');
  thread.scrollTop = thread.scrollHeight;

  // Mark all unread admin messages as read
  const unread = data.filter(m => m.is_from_admin && !m.is_read);
  if (unread.length) {
    await supabase.from('messages')
      .update({ is_read: true })
      .eq('client_id', currentUid)
      .eq('is_from_admin', true)
      .eq('is_read', false);
    // Clear the badge
    const badge = document.getElementById('msgBadge');
    if (badge) badge.style.display = 'none';
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function sendMessage() {
  const input   = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  const { error } = await supabase.from('messages').insert({
    client_id: currentUid, content, author_id: currentUid, is_from_admin: false
  });
  if (!error) loadMessages();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// Real-time subscription
function subscribeMessages() {
  supabase.channel('messages-channel')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `client_id=eq.${currentUid}` },
      () => loadMessages())
    .subscribe();
}

(async () => {
  const session = await requireAuth(); if (!session) return;
  currentUid = session.user.id;
  const profile = await getProfile(currentUid);
  setNavUser(profile, session);
  await loadMessages();
  subscribeMessages();
})();
</script>
