  <div class="pmh-user"><div class="pmh-avatar" id="mobileInitial">?</div></div>

      <div class="sidebar-logo-tag">Portal</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="files.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Files
      </a>
      <a href="schedule.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Schedule
      </a>
      <a href="messages.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
        <span class="nav-unread" id="msgBadge" style="display:none;"></span>
      </a>
      <a href="projects.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Projects
      </a>
    </nav>
    <div class="sidebar-back">
      <a href="/" class="sidebar-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to ON-Q25.com
      </a>
    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="navInitial">?</div>
        <span class="sidebar-user-name" id="navName">Loading…</span>
        <a href="account.html" class="sidebar-signout active" title="Account settings" style="color:var(--blue-lt);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>
        </a>
        <button class="sidebar-signout" onclick="signOut()" title="Sign out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="portal-main">
    <div class="page-header">
      <h1>Account Settings</h1>
      <p>Update your profile and password.</p>
    </div>

    <div style="max-width:540px;display:flex;flex-direction:column;gap:20px;">

      <!-- PROFILE SECTION -->
      <div class="card">
        <div class="section-title">Profile</div>
        <form id="profileForm">
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input class="form-input" type="text" id="fullName" placeholder="Your name" />
          </div>
          <div class="form-group">
            <label class="form-label">Business name</label>
            <input class="form-input" type="text" id="businessName" placeholder="Your business (optional)" />
          </div>
          <div class="form-group">
            <label class="form-label">Email address</label>
            <input class="form-input" type="email" id="emailDisplay" disabled style="opacity:0.5;cursor:not-allowed;" />
            <div style="font-size:0.72rem;color:var(--gray);margin-top:5px;">Contact ON-Q25 to change your email.</div>
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:4px;">
            <button type="submit" class="btn btn-primary" id="profileBtn">Save Profile</button>
          </div>
        </form>
      </div>

      <!-- PASSWORD SECTION -->
      <div class="card">
        <div class="section-title">Change Password</div>
        <form id="passwordForm">
          <div class="form-group">
            <label class="form-label">New password</label>
            <input class="form-input" type="password" id="newPassword" placeholder="••••••••" minlength="8" required />
          </div>
          <div class="form-group">
            <label class="form-label">Confirm new password</label>
            <input class="form-input" type="password" id="confirmPassword" placeholder="••••••••" minlength="8" required />
          </div>
          <div style="display:flex;justify-content:flex-end;margin-top:4px;">
            <button type="submit" class="btn btn-primary" id="passwordBtn">Update Password</button>
          </div>
        </form>
      </div>

    </div>
  </main>
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="portal-mobile-nav">
  <a href="dashboard.html" class="pmn-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Home
  </a>
  <a href="files.html" class="pmn-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    Files
  </a>
  <a href="schedule.html" class="pmn-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Schedule
  </a>
  <a href="messages.html" class="pmn-item" style="position:relative;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Messages
    <span class="pmn-unread" id="msgBadgeMobile" style="display:none;"></span>
  </a>
  <a href="projects.html" class="pmn-item">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Projects
  </a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

(async () => {
  const session = await requireAuth();
  if (!session) return;
  const uid = session.user.id;
  const profile = await getProfile(uid);
  setNavUser(profile, session);
  loadUnreadBadge(uid);

  const mInit = document.getElementById('mobileInitial');
  if (mInit) mInit.textContent = (profile?.full_name || session.user.email || '?').charAt(0).toUpperCase();

  // Pre-fill form
  document.getElementById('fullName').value     = profile?.full_name && !profile.full_name.includes('@') ? profile.full_name : '';
  document.getElementById('businessName').value = profile?.business_name || '';
  document.getElementById('emailDisplay').value = session.user.email || '';

  // Save profile
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('profileBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const full_name     = document.getElementById('fullName').value.trim();
    const business_name = document.getElementById('businessName').value.trim();

    const { error } = await supabase
      .from('profiles')
      .update({ full_name: full_name || null, business_name: business_name || null })
      .eq('id', uid);

    btn.disabled = false;
    btn.textContent = 'Save Profile';

    if (error) {
      showToast(error.message, 'error');
    } else {
      // Update nav immediately
      const navName = document.getElementById('navName');
      const navInitial = document.getElementById('navInitial');
      if (navName) navName.textContent = full_name || session.user.email;
      if (navInitial) navInitial.textContent = (full_name || session.user.email).charAt(0).toUpperCase();
      showToast('Profile updated');
    }
  });

  // Change password
  document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn     = document.getElementById('passwordBtn');
    const newPw   = document.getElementById('newPassword').value;
    const confPw  = document.getElementById('confirmPassword').value;

    if (newPw !== confPw) {
      showToast('Passwords do not match', 'error');
      return;
    }
    if (newPw.length < 8) {
      showToast('Password must be at least 8 characters', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating…';

    const { error } = await supabase.auth.updateUser({ password: newPw });

    btn.disabled = false;
    btn.textContent = 'Update Password';

    if (error) {
      showToast(error.message, 'error');
    } else {
      document.getElementById('passwordForm').reset();
      showToast('Password updated successfully');
    }
  });
})();
</script>
</body>
</html>
