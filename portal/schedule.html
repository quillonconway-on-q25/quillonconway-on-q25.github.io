    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="files.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Files</a>
      <a href="schedule.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Schedule</a>

    <div class="sidebar-back">

        Back to ON-Q25.com

    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="navInitial">?</div>
        <span class="sidebar-user-name" id="navName">Loading…</span>
        <a href="account.html" class="sidebar-signout" title="Account settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg></a>
        <button class="sidebar-signout" onclick="signOut()" title="Sign out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>

  <main class="portal-main">
    <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div><h1>Schedule</h1><p>Your upcoming meetings, deadlines, and milestones.</p></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="view-toggle">
          <button id="btnList" class="view-toggle-btn active" onclick="switchView('list')">

            List
          </button>
          <button id="btnCal" class="view-toggle-btn" onclick="switchView('calendar')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Calendar
          </button>
        </div>
        <button class="btn btn-primary" onclick="openModal()">+ Add Event</button>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div id="listView">
      <div class="card">
        <div id="scheduleList"><div class="loading-state">Loading…</div></div>
        <div id="emptySchedule" class="empty-state" style="display:none;">
          <div class="empty-state-icon">📅</div>
          <h3>No events yet</h3>
          <p>Add your first meeting or deadline above.</p>
        </div>
      </div>
    </div>

    <!-- CALENDAR VIEW -->
    <div id="calendarView" style="display:none;">
      <div class="cal-nav">
        <button class="btn btn-outline btn-sm" onclick="prevMonth()">‹ Prev</button>
        <span id="calMonthLabel" style="font-weight:700;font-size:1rem;"></span>
        <button class="btn btn-outline btn-sm" onclick="nextMonth()">Next ›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </main>
</div>

<!-- ADD / EDIT EVENT MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:460px;margin:24px;">
    <h2 id="modalTitle" style="font-size:1.1rem;margin-bottom:24px;">Add Event</h2>
    <input type="hidden" id="evId" />
    <form id="eventForm">
      <div class="form-group">
        <label>Title *</label>
        <input class="form-input" id="evTitle" required placeholder="e.g. Brand Review Call" />
      </div>
      <div class="form-group">
        <label>Date &amp; Time *</label>
        <input class="form-input" type="datetime-local" id="evDate" required />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-textarea" id="evDesc" placeholder="Optional notes…" style="min-height:80px;"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="modalSaveBtn">Save Event</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>


<!-- MOBILE BOTTOM NAV -->
<nav class="portal-mobile-nav">
  <a href="dashboard.html" class="pmn-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Home</a>
  <a href="files.html" class="pmn-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Files</a>
  <a href="schedule.html" class="pmn-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Schedule</a>
  <a href="messages.html" class="pmn-item" style="position:relative;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages<span class="pmn-unread" id="msgBadgeMobile" style="display:none;"></span></a>
  <a href="projects.html" class="pmn-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Projects</a>
</nav>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
let currentUid = null;
let currentView = 'list';
let calYear  = new Date().getFullYear();
let calMonth = new Date().getMonth();
let allEvents = [];

function switchView(view) {
  currentView = view;
  document.getElementById('listView').style.display     = view === 'list'     ? '' : 'none';
  document.getElementById('calendarView').style.display = view === 'calendar' ? '' : 'none';
  document.getElementById('btnList').classList.toggle('active', view === 'list');
  document.getElementById('btnCal').classList.toggle('active', view === 'calendar');
  if (view === 'calendar') renderCalendar();
}

function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

function renderCalendar() {
  const DOW   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = new Date();
  const first = new Date(calYear, calMonth, 1);
  const days  = new Date(calYear, calMonth + 1, 0).getDate();
  const start = first.getDay(); // 0=Sun

  document.getElementById('calMonthLabel').textContent =
    first.toLocaleString('en-US', { month: 'long', year: 'numeric' });

  let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < start; i++) html += `<div class="cal-empty"></div>`;

  const pad = n => String(n).padStart(2,'0');

  for (let d = 1; d <= days; d++) {
    const dateStr = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const evs = allEvents.filter(e => e.scheduled_date?.slice(0,10) === dateStr);
    const isToday = today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d;
    html += `<div class="cal-day${isToday?' cal-today':''}" onclick="calDayClick('${dateStr}')">
      <div class="cal-day-num">${d}</div>
      ${evs.map(e => {
        const safeTitle = e.title.replace(/'/g,"\\'").replace(/"/g,'&quot;');
        const safeDesc  = (e.description||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
        return `<div class="cal-event cal-ev-${e.status}" onclick="event.stopPropagation();openEditModal('${e.id}','${safeTitle}','${e.scheduled_date}','${safeDesc}')" title="${e.title}">${e.title.length>16?e.title.slice(0,16)+'…':e.title}</div>`;
      }).join('')}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function calDayClick(dateStr) {
  // Pre-fill the modal date field and open for adding
  const d = new Date(dateStr + 'T09:00');
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('evId').value    = '';
  document.getElementById('evTitle').value = '';
  document.getElementById('evDate').value  = `${dateStr}T09:00`;
  document.getElementById('evDesc').value  = '';
  document.getElementById('modalTitle').textContent   = 'Add Event';
  document.getElementById('modalSaveBtn').textContent = 'Save Event';
  document.getElementById('modal').style.display = 'flex';
}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

function openModal() {
  document.getElementById('evId').value    = '';
  document.getElementById('modalTitle').textContent  = 'Add Event';
  document.getElementById('modalSaveBtn').textContent = 'Save Event';
  document.getElementById('eventForm').reset();
  document.getElementById('modal').style.display = 'flex';
}

function openEditModal(id, title, scheduledDate, desc) {
  document.getElementById('evId').value   = id;
  document.getElementById('evTitle').value = title;
  // Format ISO → datetime-local (YYYY-MM-DDTHH:MM)
  const local = new Date(scheduledDate);
  const pad   = n => String(n).padStart(2,'0');
  document.getElementById('evDate').value =
    `${local.getFullYear()}-${pad(local.getMonth()+1)}-${pad(local.getDate())}T${pad(local.getHours())}:${pad(local.getMinutes())}`;
  document.getElementById('evDesc').value  = desc || '';
  document.getElementById('modalTitle').textContent   = 'Edit Event';
  document.getElementById('modalSaveBtn').textContent  = 'Save Changes';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

const statusBadge = { upcoming:'badge-blue', completed:'badge-green', cancelled:'badge-gray' };

async function loadSchedule() {
  const { data, error } = await supabase.from('schedule_items').select('*').eq('client_id', currentUid).order('scheduled_date');
  allEvents = data || [];
  if (error) { document.getElementById('scheduleList').innerHTML = errorHtml; return; }
  if (currentView === 'calendar') { renderCalendar(); return; }
  const list  = document.getElementById('scheduleList');
  const empty = document.getElementById('emptySchedule');
  if (!data?.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  list.innerHTML = data.map(e => {
    const d    = new Date(e.scheduled_date);
    const safeTitle = e.title.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    const safeDesc  = (e.description||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
    return `<div class="schedule-item">
      <div class="schedule-date-badge">
        <div class="month">${d.toLocaleString('en-US',{month:'short'})}</div>
        <div class="day">${d.getDate()}</div>
      </div>
      <div class="schedule-details" style="flex:1;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="schedule-title">${e.title}</div>
          <span class="badge ${statusBadge[e.status]||'badge-gray'}">${e.status}</span>
        </div>
        <div class="schedule-time">${formatTime(e.scheduled_date)} · ${formatDate(e.scheduled_date)}</div>
        ${e.description ? `<div class="schedule-desc">${e.description}</div>` : ''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${e.status==='upcoming' ? `
          <button class="btn btn-outline btn-sm" onclick="openEditModal('${e.id}','${safeTitle}','${e.scheduled_date}','${safeDesc}')">Edit</button>
          <button class="btn btn-outline btn-sm" onclick="markDone('${e.id}')">Mark Done</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function markDone(id) {
  await supabase.from('schedule_items').update({ status: 'completed' }).eq('id', id);
  showToast('Marked as completed'); loadSchedule();
}

async function deleteEvent(id) {
  if (!confirm('Delete this event?')) return;
  await supabase.from('schedule_items').delete().eq('id', id);
  showToast('Event deleted'); loadSchedule();
}

document.getElementById('eventForm').addEventListener('submit', async e => {
  e.preventDefault();
  const id    = document.getElementById('evId').value;
  const title = document.getElementById('evTitle').value.trim();
  const date  = document.getElementById('evDate').value;
  const desc  = document.getElementById('evDesc').value.trim();
  if (!title || !date) return;

  if (id) {
    // Edit existing
    const { error } = await supabase.from('schedule_items')
      .update({ title, scheduled_date: date, description: desc || null })
      .eq('id', id);
    if (error) { showToast(error.message, 'error'); return; }
    showToast('Event updated');
  } else {
    // New event
    const { error } = await supabase.from('schedule_items').insert({
      client_id: currentUid, title, scheduled_date: date,
      description: desc || null, status: 'upcoming'
    });
    if (error) { showToast(error.message, 'error'); return; }
    showToast('Event added');
  }

  closeModal();
  loadSchedule();
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

(async () => {
  const session = await requireAuth(); if (!session) return;
  currentUid = session.user.id;
  const profile = await getProfile(currentUid);
  setNavUser(profile, session);
  loadUnreadBadge(currentUid);
  loadSchedule();

  // Real-time: refresh whenever admin adds/edits/deletes an event for this client
  supabase.channel('schedule-live')
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'schedule_items',
      filter: `client_id=eq.${currentUid}`
    }, () => loadSchedule())
    .subscribe();
})();
</script>
<style>
/* View toggle */
.view-toggle { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; gap:3px; }
.view-toggle-btn { background:none; border:none; color:var(--gray); font-size:0.78rem; font-weight:600; font-family:var(--font); padding:5px 12px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all 0.15s; }
.view-toggle-btn:hover  { color:var(--off-white); }
.view-toggle-btn.active { background:var(--blue); color:#fff; }

/* Calendar nav */
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }

/* Calendar grid */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.cal-dow {
  background: var(--surface2);
  padding: 8px 6px;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--gray);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.cal-empty { background: var(--surface); min-height: 80px; }
.cal-day {
  background: var(--surface);
  min-height: 80px;
  padding: 6px;
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
}
.cal-day:hover { background: var(--surface2); }
.cal-today { background: rgba(59,110,245,0.08); }
.cal-today .cal-day-num { color: var(--blue-lt); font-weight: 700; }
.cal-day-num { font-size: 0.78rem; font-weight: 500; color: var(--gray-lt); margin-bottom: 4px; }
.cal-event {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 4px;
  margin-bottom: 2px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.12s;
}
.cal-event:hover { opacity: 0.8; }
.cal-ev-upcoming   { background: rgba(59,110,245,0.18); color: #93b4ff; }
.cal-ev-completed  { background: rgba(74,222,128,0.15); color: #4ade80; }
.cal-ev-cancelled  { background: rgba(107,114,128,0.15); color: var(--gray); text-decoration: line-through; }

@media (max-width: 640px) {
  /* On mobile: shrink cells to number + dots only */
  .cal-day  { min-height: 48px; padding: 4px 2px; }
  .cal-dow  { padding: 6px 2px; font-size: 0.62rem; }

  /* Hide event text, show as colored dot instead */
  .cal-event {
    font-size: 0;
    width: 7px; height: 7px;
    border-radius: 50%;
    padding: 0;
    margin: 1px auto;
    display: block;
  }
  .cal-ev-upcoming  { background: var(--blue-lt); }
  .cal-ev-completed { background: var(--green); }
  .cal-ev-cancelled { background: var(--gray); }
}
</style>
</body>
</html>
