<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal2.css" />
</head>
<body>
<div class="portal-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">ON-<span>Q</span>25</div>
      <div class="sidebar-logo-tag">Portal</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="files.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Files</a>
      <a href="schedule.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Schedule</a>
      <a href="messages.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Messages</a>
      <a href="projects.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Projects</a>
    </nav>
    <div class="sidebar-back">
      <a href="/" class="sidebar-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back to ON-Q25.com
      </a>
    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="navInitial">?</div>
        <span class="sidebar-user-name" id="navName">Loading…</span>
        <button class="sidebar-signout" onclick="signOut()" title="Sign out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="portal-main">
    <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;">
      <div><h1>Schedule</h1><p>Your upcoming meetings, deadlines, and milestones.</p></div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Event</button>
    </div>

    <div class="card">
      <div id="scheduleList"></div>
      <div id="emptySchedule" class="empty-state" style="display:none;">
        <div class="empty-state-icon">📅</div>
        <h3>No events yet</h3>
        <p>Add your first meeting or deadline above.</p>
      </div>
    </div>
  </main>
</div>

<!-- ADD EVENT MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:460px;margin:24px;">
    <h2 style="font-size:1.1rem;margin-bottom:24px;">Add Event</h2>
    <form id="eventForm">
      <div class="form-group">
        <label>Title *</label>
        <input class="form-input" id="evTitle" required placeholder="e.g. Brand Review Call" />
      </div>
      <div class="form-group">
        <label>Date &amp; Time *</label>
        <input class="form-input" type="datetime-local" id="evDate" required />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-textarea" id="evDesc" placeholder="Optional notes…" style="min-height:80px;"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Event</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
let currentUid = null;

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

function openModal()  { document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }

const statusBadge = { upcoming:'badge-blue', completed:'badge-green', cancelled:'badge-gray' };

async function loadSchedule() {
  const { data } = await supabase.from('schedule_items').select('*').eq('client_id', currentUid).order('scheduled_date');
  const list  = document.getElementById('scheduleList');
  const empty = document.getElementById('emptySchedule');
  if (!data?.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  list.innerHTML = data.map(e => {
    const d = new Date(e.scheduled_date);
    return `<div class="schedule-item">
      <div class="schedule-date-badge">
        <div class="month">${d.toLocaleString('en-US',{month:'short'})}</div>
        <div class="day">${d.getDate()}</div>
      </div>
      <div class="schedule-details" style="flex:1;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div class="schedule-title">${e.title}</div>
          <span class="badge ${statusBadge[e.status]||'badge-gray'}">${e.status}</span>
        </div>
        <div class="schedule-time">${formatTime(e.scheduled_date)} · ${formatDate(e.scheduled_date)}</div>
        ${e.description ? `<div class="schedule-desc">${e.description}</div>` : ''}
      </div>
      <div style="display:flex;gap:6px;">
        ${e.status==='upcoming' ? `<button class="btn btn-outline btn-sm" onclick="markDone('${e.id}')">Mark Done</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteEvent('${e.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function markDone(id) {
  await supabase.from('schedule_items').update({ status: 'completed' }).eq('id', id);
  showToast('Marked as completed'); loadSchedule();
}

async function deleteEvent(id) {
  if (!confirm('Delete this event?')) return;
  await supabase.from('schedule_items').delete().eq('id', id);
  showToast('Event deleted'); loadSchedule();
}

document.getElementById('eventForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = document.getElementById('evTitle').value.trim();
  const date  = document.getElementById('evDate').value;
  const desc  = document.getElementById('evDesc').value.trim();
  if (!title || !date) return;
  const { error } = await supabase.from('schedule_items').insert({
    client_id: currentUid, title, scheduled_date: date,
    description: desc || null, status: 'upcoming'
  });
  if (error) { showToast(error.message, 'error'); return; }
  closeModal();
  document.getElementById('eventForm').reset();
  showToast('Event added'); loadSchedule();
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

(async () => {
  const session = await requireAuth(); if (!session) return;
  currentUid = session.user.id;
  const profile = await getProfile(currentUid);
  setNavUser(profile, session);
  loadSchedule();
})();
</script>
</body>
</html>
