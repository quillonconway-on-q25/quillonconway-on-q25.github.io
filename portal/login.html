<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Login — ON-Q25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal2.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="login-brand-logo">ON-<span>Q</span>25</div>
        <div class="login-brand-sub">Client Portal — Sign in to your account</div>
      </div>
      <div class="login-box">
        <div class="login-err" id="loginErr"></div>
        <form id="loginForm">
          <label class="login-label" for="email">Email address</label>
          <input class="login-input" type="email" id="email" required placeholder="you@example.com" />
          <label class="login-label" for="password">Password</label>
          <input class="login-input" type="password" id="password" required placeholder="••••••••" />
          <button class="login-submit" type="submit" id="submitBtn">Sign In</button>
        </form>
      </div>
      <div class="login-footer">
        Don't have access? <a href="mailto:daquanconway@on-q25.com">Contact ON-Q25</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    // If already logged in, redirect based on role
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;
      const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', session.user.id).single();
      window.location.href = profile?.is_admin ? 'admin.html' : 'dashboard.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const err = document.getElementById('loginErr');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Request timed out — check your internet connection and try again.')), 10000)
        );
        const signIn = supabase.auth.signInWithPassword({ email, password });
        const { data, error } = await Promise.race([signIn, timeout]);

        console.log('Auth response:', { data, error });

        if (error) {
          err.textContent = error.message;
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        } else {
          const { data: profile } = await supabase.from('profiles').select('is_admin').eq('id', data.user.id).single();
          window.location.href = profile?.is_admin ? 'admin.html' : 'dashboard.html';
        }
      } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
