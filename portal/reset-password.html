<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — ON-Q25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="portal2.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-wrap">
      <div class="login-brand">
        <div class="login-brand-logo">ON-<span>Q</span>25</div>
        <div class="login-brand-sub">Client Portal — Set a new password</div>
      </div>
      <div class="login-box">
        <!-- Loading state -->
        <div id="loadingView" style="text-align:center;color:var(--gray);padding:16px 0;font-size:0.9rem;">
          Verifying reset link…
        </div>

        <!-- Invalid / expired token -->
        <div id="invalidView" style="display:none;">
          <div class="login-err" style="display:block;">
            This reset link is invalid or has expired. Please request a new one.
          </div>
          <a href="login.html" class="login-submit" style="display:block;text-align:center;margin-top:12px;text-decoration:none;">
            Back to Sign In
          </a>
        </div>

        <!-- New password form -->
        <div id="resetView" style="display:none;">
          <div class="login-err" id="resetErr"></div>
          <form id="resetForm">
            <label class="login-label" for="newPassword">New password</label>
            <input class="login-input" type="password" id="newPassword" required placeholder="••••••••" minlength="8" />
            <label class="login-label" for="confirmPassword" style="margin-top:14px;">Confirm new password</label>
            <input class="login-input" type="password" id="confirmPassword" required placeholder="••••••••" minlength="8" />
            <button class="login-submit" type="submit" id="resetBtn" style="margin-top:20px;">Update Password</button>
          </form>
        </div>

        <!-- Success state -->
        <div id="successView" style="display:none;text-align:center;padding:8px 0;">
          <div style="font-size:2rem;margin-bottom:12px;">✓</div>
          <div style="color:var(--white);font-weight:600;margin-bottom:6px;">Password updated!</div>
          <div style="color:var(--gray);font-size:0.85rem;margin-bottom:20px;">You can now sign in with your new password.</div>
          <a href="login.html" class="login-submit" style="display:block;text-align:center;text-decoration:none;">
            Go to Sign In
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const loadingView  = document.getElementById('loadingView');
    const invalidView  = document.getElementById('invalidView');
    const resetView    = document.getElementById('resetView');
    const successView  = document.getElementById('successView');

    function show(view) {
      [loadingView, invalidView, resetView, successView].forEach(v => v.style.display = 'none');
      view.style.display = '';
    }

    // Listen for auth state events — Supabase processes the recovery token
    // from the URL automatically and fires PASSWORD_RECOVERY when ready.
    // We never use a timeout so we don't falsely show "invalid" on slow connections.
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        show(resetView);
      } else if (event === 'SIGNED_IN' && window._passwordUpdated) {
        show(successView);
      } else if (event === 'INITIAL_SESSION' && !session) {
        // Page loaded with no active session and no recovery token was processed
        show(invalidView);
      }
    });

    // If there's no token-like fragment in the URL at all, show invalid immediately
    // without waiting for the auth event (saves a round-trip).
    const hash = window.location.hash;
    if (!hash.includes('access_token') && !hash.includes('type=recovery')) {
      show(invalidView);
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn  = document.getElementById('resetBtn');
      const err  = document.getElementById('resetErr');
      err.style.display = 'none';

      const newPw  = document.getElementById('newPassword').value;
      const confPw = document.getElementById('confirmPassword').value;

      if (newPw !== confPw) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return;
      }
      if (newPw.length < 8) {
        err.textContent = 'Password must be at least 8 characters.';
        err.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating…';

      const { error } = await supabase.auth.updateUser({ password: newPw });

      if (error) {
        err.textContent = error.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Update Password';
      } else {
        window._passwordUpdated = true;
        show(successView);
      }
    });
  </script>
</body>
</html>
