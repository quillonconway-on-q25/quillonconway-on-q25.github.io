<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
const statusProgress = { not_started: 5, in_progress: 50, review: 80, complete: 100 };
const statusLabel    = { not_started: 'Not Started', in_progress: 'In Progress', review: 'In Review', complete: 'Complete' };
const statusBadge    = { not_started: 'badge-gray', in_progress: 'badge-blue', review: 'badge-yellow', complete: 'badge-green' };

function buildProjectCard(p) {
  const pct       = p.status === 'complete' ? 100 : (p.progress ?? statusProgress[p.status] ?? 0);
  const today     = new Date(); today.setHours(0,0,0,0);
  const isOverdue = p.due_date && p.status !== 'complete' && new Date(p.due_date) < today;
  const dueLabel  = p.due_date
    ? `<div style="font-size:0.75rem;margin-top:10px;color:${isOverdue ? '#f87171' : 'var(--gray)'};">${isOverdue ? '⚠ Overdue · ' : 'Due '}${new Date(p.due_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>`
    : '';
  return `<div class="card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:1rem;font-weight:700;">${p.name}</div>
        ${p.description ? `<div style="font-size:0.8rem;color:var(--gray);margin-top:4px;">${p.description}</div>` : ''}
      </div>
      <span class="badge ${statusBadge[p.status]||'badge-gray'}" style="flex-shrink:0;margin-left:10px;">${statusLabel[p.status]||p.status}</span>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--gray);margin-bottom:6px;">
        <span>Progress</span><span>${pct}%</span>
      </div>
      <div class="progress-bar-wrap" style="max-width:100%;"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    ${dueLabel}
  </div>`;
}

async function loadProjects(uid) {
  const { data, error } = await supabase.from('projects').select('*').eq('client_id', uid).order('created_at', { ascending: false });
  const cards = document.getElementById('projectCards');
  const empty = document.getElementById('emptyProjects');
  if (error) { cards.innerHTML = errorHtml; return; }
  if (!data?.length) { cards.innerHTML = ''; empty.style.display = 'block'; return; }

  const active    = data.filter(p => p.status !== 'complete');
  const completed = data.filter(p => p.status === 'complete');
  empty.style.display = 'none';
  let html = '';

  if (active.length) {
    html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;">${active.map(buildProjectCard).join('')}</div>`;
  } else if (completed.length) {
    html += `<div class="empty-state" style="padding:32px;"><div class="empty-state-icon">✅</div><h3>All caught up</h3><p>No projects in progress right now.</p></div>`;
  }

  if (completed.length) {
    const autoOpen = active.length === 0;
    html += `
      <div style="margin-top:${active.length ? '28px' : '0'};">
        <button onclick="toggleCompleted(this)" style="display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--gray);font-size:0.82rem;font-weight:600;font-family:var(--font);cursor:pointer;padding:0;margin-bottom:14px;">
          <svg id="completedChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.2s;transform:rotate(${autoOpen ? '90' : '0'}deg);"><polyline points="9 18 15 12 9 6"/></svg>
          Completed (${completed.length})
        </button>
        <div id="completedGrid" style="display:${autoOpen ? 'grid' : 'none'};grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;opacity:0.65;">
          ${completed.map(buildProjectCard).join('')}
        </div>
      </div>`;
  }

  cards.innerHTML = html;
}

function toggleCompleted(btn) {
  const grid    = document.getElementById('completedGrid');
  const chevron = document.getElementById('completedChevron');
  const isOpen  = grid.style.display !== 'none';
  grid.style.display      = isOpen ? 'none' : 'grid';
  chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
}

(async () => {
  const session = await requireAuth(); if (!session) return;
  const uid = session.user.id;
  const profile = await getProfile(uid);
  setNavUser(profile, session);
  loadUnreadBadge(uid);
  loadDeliverableBadge(uid);
  loadProjects(uid);
})();
</script>
