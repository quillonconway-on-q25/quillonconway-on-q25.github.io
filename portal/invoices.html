<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
function fmt(amount) {
  return '$' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const statusLabel = { due: 'Due', overdue: 'Overdue', paid: 'Paid' };
const statusBadge = { due: 'badge-blue', overdue: 'badge-red', paid: 'badge-green' };

async function loadInvoices(uid) {
  const { data } = await supabase
    .from('invoices').select('*').eq('client_id', uid).order('created_at', { ascending: false });

  const list  = document.getElementById('invoiceList');
  const empty = document.getElementById('emptyInvoices');

  if (!data?.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  // Totals
  const totalDue      = data.filter(i => i.status === 'due').reduce((s, i) => s + Number(i.amount), 0);
  const totalOverdue  = data.filter(i => i.status === 'overdue').reduce((s, i) => s + Number(i.amount), 0);
  const totalPaid     = data.filter(i => i.status === 'paid').reduce((s, i) => s + Number(i.amount), 0);
  document.getElementById('statDue').textContent     = fmt(totalDue);
  document.getElementById('statOverdue').textContent = fmt(totalOverdue);
  document.getElementById('statPaid').textContent    = fmt(totalPaid);

  list.innerHTML = data.map(inv => `
    <div class="invoice-row">
      <div class="invoice-left">
        <div class="invoice-title">${inv.title}</div>
        ${inv.due_date ? `<div class="invoice-meta">Due ${new Date(inv.due_date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>` : ''}
        ${inv.notes ? `<div class="invoice-notes">${inv.notes}</div>` : ''}
      </div>
      <div class="invoice-right">
        <div class="invoice-amount">${fmt(inv.amount)}</div>
        <span class="badge ${statusBadge[inv.status] || 'badge-gray'}">${statusLabel[inv.status] || inv.status}</span>
        ${inv.pdf_url ? `<a href="${inv.pdf_url}" target="_blank" class="btn btn-outline btn-sm" style="margin-top:8px;">View PDF</a>` : ''}
      </div>
    </div>`).join('');
}

(async () => {
  const session = await requireAuth(); if (!session) return;
  const uid = session.user.id;
  const profile = await getProfile(uid);
  setNavUser(profile, session);
  loadUnreadBadge(uid);
  const mInit = document.getElementById('mobileInitial');
  if (mInit) mInit.textContent = (profile?.full_name || session.user.email || '?').charAt(0).toUpperCase();
  loadInvoices(uid);
})();
</script>

<style>
.invoice-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}
.invoice-row:last-child { border-bottom: none; }
.invoice-left { flex: 1; min-width: 0; }
.invoice-title { font-size: 0.95rem; font-weight: 600; color: var(--white); margin-bottom: 4px; }
.invoice-meta  { font-size: 0.78rem; color: var(--gray); }
.invoice-notes { font-size: 0.78rem; color: var(--gray); margin-top: 4px; }
.invoice-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px; flex-shrink: 0;
}
.invoice-amount { font-size: 1.05rem; font-weight: 700; color: var(--white); }
.badge-red { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.25); }
</style>
